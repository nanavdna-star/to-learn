<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហ្គេមទាញព្រ័ត្រគណិតវិទ្យា Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #e0f2fe;
            user-select: none;
            touch-action: manipulation;
        }

        /* តំបន់ទីលានទាញព្រ័ត្រ */
        .arena {
            background: linear-gradient(to bottom, #7dd3fc 60%, #a16207 60%);
            height: 320px;
            position: relative;
            border: 6px solid #451a03;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
        }

        /* ខ្សែព្រ័ត្រ */
        .rope {
            position: absolute;
            top: 72%;
            left: 50%;
            width: 200%;
            height: 12px;
            background: repeating-linear-gradient(45deg, #d2b48c, #d2b48c 10px, #8b4513 10px, #8b4513 20px);
            transform: translate(-50%, -50%);
            transition: left 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        /* បូព្រ័ត្រ (ចំណុចកណ្ដាល) */
        .rope-ribbon {
            position: absolute;
            top: -15px;
            left: 50%;
            width: 8px;
            height: 45px;
            background-color: #ff0000;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
            border-radius: 4px;
        }

        /* តួអង្គ */
        .char {
            font-size: 4.5rem;
            position: absolute;
            bottom: 10px;
            transition: all 0.6s ease;
            filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.3));
        }
        .player { left: 15%; }
        .enemy { right: 15%; }

        /* បែបផែនចលនា */
        .shake { animation: shakeAnim 0.4s; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .bounce { animation: bounceAnim 0.5s infinite; }
        @keyframes bounceAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* របារពេលវេលា */
        .timer-bar {
            height: 8px;
            background: #22c55e;
            transition: width 0.1s linear;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <!-- អេក្រង់ជ្រើសរើស Level -->
    <div id="setup-screen" class="fixed inset-0 bg-blue-600 z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center border-b-8 border-gray-200">
            <h1 class="text-4xl font-black text-blue-600 mb-6">ជ្រើសរើសកម្រិត</h1>
            <div class="flex flex-col gap-4">
                <button onclick="startGame(1)" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl text-xl shadow-[0_6px_0_#166534] active:translate-y-1 active:shadow-none transition-all">កម្រិត ១: ងាយស្រួល</button>
                <button onclick="startGame(2)" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl text-xl shadow-[0_6px_0_#9a3412] active:translate-y-1 active:shadow-none transition-all">កម្រិត ២: មធ្យម</button>
                <button onclick="startGame(3)" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl text-xl shadow-[0_6px_0_#7f1d1d] active:translate-y-1 active:shadow-none transition-all">កម្រិត ៣: ពិបាក</button>
            </div>
            <p class="mt-6 text-gray-400">តើអ្នកពូកែគណិតវិទ្យាកម្រិតណា?</p>
        </div>
    </div>

    <!-- ផ្ទៃហ្គេមចម្បង -->
    <div class="max-w-2xl w-full bg-white rounded-[2.5rem] shadow-2xl p-8 border-b-8 border-gray-200">
        
        <!-- Scoreboard -->
        <div class="flex justify-between items-center mb-6">
            <div class="text-center">
                <p class="text-xs font-bold text-blue-400 uppercase tracking-widest">អ្នកលេង</p>
                <p id="p-score" class="text-4xl font-black text-blue-600">0</p>
            </div>
            <div class="flex-1 px-10 text-center">
                <div id="lv-badge" class="inline-block bg-blue-100 text-blue-600 px-4 py-1 rounded-full text-xs font-bold mb-3">LEVEL: 1</div>
                <div class="w-full bg-gray-100 rounded-full h-4 border border-gray-200 overflow-hidden">
                    <div id="tug-progress" class="bg-blue-500 h-full transition-all duration-700" style="width: 50%"></div>
                </div>
            </div>
            <div class="text-center">
                <p class="text-xs font-bold text-red-400 uppercase tracking-widest">យក្ស</p>
                <p id="e-score" class="text-4xl font-black text-red-600">0</p>
            </div>
        </div>

        <!-- Arena -->
        <div class="arena mb-8">
            <div id="rope-obj" class="rope"><div class="rope-ribbon"></div></div>
            <div id="char-p" class="char player">👦</div>
            <div id="char-e" class="char enemy">👹</div>
            
            <!-- Question Box -->
            <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-white/95 p-4 rounded-2xl shadow-xl border-b-4 border-blue-200 min-w-[220px] text-center">
                <p id="math-display" class="text-3xl font-black text-gray-800 tracking-tighter">...</p>
                <div class="w-full bg-gray-200 mt-3 rounded-full overflow-hidden">
                    <div id="timer-line" class="timer-bar" style="width: 100%"></div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="flex gap-4">
            <input type="number" id="ans-input" 
                   class="flex-1 text-center text-4xl font-bold border-4 border-blue-50 bg-blue-50/30 rounded-2xl p-4 focus:border-blue-400 outline-none transition-all shadow-inner" 
                   placeholder="?" autocomplete="off">
            <button onclick="handleAnswer()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-black px-12 py-4 rounded-2xl shadow-[0_6px_0_#1e3a8a] active:translate-y-1 active:shadow-none transition-all text-2xl">
                ឆ្លើយ
            </button>
        </div>
    </div>

    <!-- Modal លទ្ធផល -->
    <div id="result-modal" class="fixed inset-0 bg-black/90 z-[200] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-12 rounded-[3rem] text-center max-w-sm w-full">
            <div id="res-emoji" class="text-8xl mb-6">🏆</div>
            <h2 id="res-title" class="text-4xl font-black mb-2">ឈ្នះហើយ!</h2>
            <p id="res-msg" class="text-gray-500 mb-8">អ្នកពិតជាអស្ចារ្យណាស់!</p>
            <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl text-2xl shadow-xl hover:bg-blue-700 transition-all">លេងម្ដងទៀត</button>
        </div>
    </div>

    <script>
        // Web Audio API for synthesized sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'win') {
                // Happy "Ding"
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(type === 'fail') {
                // Low "Buzzer"
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if(type === 'clap') {
                // Simple Clapping Simulation
                for(let i=0; i<15; i++) {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'square';
                    o.frequency.setValueAtTime(Math.random()*400+200, audioCtx.currentTime + (i*0.08));
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime + (i*0.08));
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i*0.08) + 0.1);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + (i*0.08)); o.stop(audioCtx.currentTime + (i*0.08) + 0.1);
                }
            }
        }

        // Game Variables
        let level = 1;
        let correctAnswer = 0;
        let ropePos = 50; // 50% is center
        let pScore = 0;
        let eScore = 0;
        let timer = null;
        let timePerQuestion = 10; // default seconds

        const input = document.getElementById('ans-input');

        function startGame(lv) {
            level = lv;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('lv-badge').innerText = `LEVEL: ${lv}`;
            timePerQuestion = lv === 1 ? 12 : lv === 2 ? 8 : 5;
            nextQuestion();
        }

        function nextQuestion() {
            let n1, n2, op = '+';
            if(level === 1) { 
                n1 = Math.floor(Math.random()*9)+1; 
                n2 = Math.floor(Math.random()*9)+1; 
            } else if(level === 2) {
                n1 = Math.floor(Math.random()*90)+10; 
                n2 = Math.floor(Math.random()*90)+10; 
                if(Math.random() > 0.5) op = '-';
                if(op === '-' && n1 < n2) [n1, n2] = [n2, n1];
            } else {
                n1 = Math.floor(Math.random()*900)+100; 
                n2 = Math.floor(Math.random()*900)+100; 
                op = Math.random() > 0.5 ? '+' : '-';
                if(op === '-' && n1 < n2) [n1, n2] = [n2, n1];
            }

            correctAnswer = op === '+' ? n1 + n2 : n1 - n2;
            document.getElementById('math-display').innerText = `${n1} ${op} ${n2} = ?`;
            input.value = '';
            input.focus();
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            let limit = timePerQuestion * 10; 
            let remaining = limit;
            const bar = document.getElementById('timer-line');
            
            timer = setInterval(() => {
                remaining--;
                bar.style.width = (remaining/limit*100) + '%';
                bar.style.backgroundColor = remaining < (limit*0.3) ? '#ef4444' : '#22c55e';
                
                if(remaining <= 0) {
                    clearInterval(timer);
                    wrongAnswer(true); // timeout count as wrong
                }
            }, 100);
        }

        function handleAnswer() {
            const userAns = parseInt(input.value);
            if(isNaN(userAns)) return;
            
            clearInterval(timer);
            if(userAns === correctAnswer) {
                rightAnswer();
            } else {
                wrongAnswer();
            }
        }

        function rightAnswer() {
            playSfx('win');
            pScore += (level * 5);
            ropePos += (level === 1 ? 8 : level === 2 ? 6 : 5);
            showEffect('✨ ត្រឹមត្រូវ', 'text-green-500');
            document.getElementById('char-p').classList.add('bounce');
            setTimeout(() => document.getElementById('char-p').classList.remove('bounce'), 1000);
            finishTurn();
        }

        function wrongAnswer(isTimeout = false) {
            playSfx('fail');
            eScore += (level * 5);
            ropePos -= 7;
            showEffect(isTimeout ? '⏰ អស់ពេល' : '❌ ខុសហើយ', 'text-red-500');
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 500);
            finishTurn();
        }

        function showEffect(txt, color) {
            const el = document.createElement('div');
            el.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-5xl font-black z-[300] transition-all duration-1000 ${color}`;
            el.innerText = txt;
            document.body.appendChild(el);
            setTimeout(() => { el.style.transform = 'translate(-50%, -200%)'; el.style.opacity = '0'; }, 50);
            setTimeout(() => el.remove(), 1000);
        }

        function finishTurn() {
            updateUI();
            if(ropePos >= 85) {
                endGame(true);
            } else if(ropePos <= 15) {
                endGame(false);
            } else {
                setTimeout(nextQuestion, 1000);
            }
        }

        function updateUI() {
            document.getElementById('p-score').innerText = pScore;
            document.getElementById('e-score').innerText = eScore;
            document.getElementById('rope-obj').style.left = ropePos + '%';
            document.getElementById('tug-progress').style.width = ropePos + '%';
            document.getElementById('tug-progress').style.backgroundColor = ropePos > 50 ? '#3b82f6' : '#ef4444';
        }

        function endGame(isWin) {
            const modal = document.getElementById('result-modal');
            modal.style.display = 'flex';
            if(isWin) {
                playSfx('clap');
                document.getElementById('res-emoji').innerText = '🏆';
                document.getElementById('res-title').innerText = 'អ្នកឈ្នះហើយ!';
                document.getElementById('res-title').className = 'text-4xl font-black mb-2 text-green-600';
                document.getElementById('res-msg').innerText = `អស្ចារ្យណាស់! អ្នកពូកែគណិតវិទ្យាកម្រិតទី ${level}។`;
            } else {
                document.getElementById('res-emoji').innerText = '👺';
                document.getElementById('res-title').innerText = 'អ្នកចាញ់ហើយ!';
                document.getElementById('res-title').className = 'text-4xl font-black mb-2 text-red-600';
                document.getElementById('res-msg').innerText = 'យក្សបានទាញអ្នកធ្លាក់ទឹកហើយ! ព្យាយាមម្ដងទៀត។';
            }
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleAnswer(); });
    </script>
</body>
</html>
